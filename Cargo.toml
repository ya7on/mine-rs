[workspace.lints.rust]
unused = { level = "warn", priority = -1 }
unused_imports = "warn"
dead_code = "warn"
missing_debug_implementations = "warn"
missing_docs = "allow"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
